[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-retrieval-core"
dynamic = ["version"]
description = "Domain-independent retrieval primitives for structured Markdown knowledge bases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
license = {text = "MIT"}
authors = [{name = "lostandfound"}]
classifiers = [
"Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/lostandfound/kb-retrieval-core"
Repository = "https://github.com/lostandfound/kb-retrieval-core"
Issues = "https://github.com/lostandfound/kb-retrieval-core/issues"

[project.scripts]
kb-retrieval = "kb_retrieval_core.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "kb_retrieval_core._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
